# Bai 1 - week 4: request lay lich su dang ky co du lieu.
$kind: http-request
url: "{{base_url}}/enrollment-events?student_id=22000004&event_type=CREATED&skip=0&limit=20"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code la 200", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Lich su co su kien CREATED", () => {
          const data = pm.response.json();
          pm.expect(data).to.be.an("array").that.is.not.empty;
          pm.expect(data.every((event) => event.student_id === "22000004")).to.eql(true);
          pm.expect(data.every((event) => event.event_type === "CREATED")).to.eql(true);
      });
    language: text/javascript
order: 24000
